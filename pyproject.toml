[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "prawemintega"
version = "0.1.0"
description = "Temporal security fuzzing for AI agent workflows"
requires-python = ">=3.10"
dependencies = ["simpy>=4.1,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
prawe = "prawemintega.core:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
